spring.application.name=dashboard

# Local settings (database password, JWT secret) live in .env next to pom.xml.
# Copy .env.example to .env and edit it. Real environment variables win over .env.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL; see README for the docker command) ---
spring.datasource.url=${MOS_DB_URL:jdbc:postgresql://127.0.0.1:54322/mos}
spring.datasource.username=${MOS_DB_USER:mos}
spring.datasource.password=${MOS_DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# --- Sign-in (JWT, HS256). At least 32 characters. ---
mos.jwt.secret=${MOS_JWT_SECRET}
mos.jwt.ttl=12h

# --- Store ---
# Opening hours are stored as local times of this zone.
mos.store.zone=Asia/Phnom_Penh
# Reserved demo-mode flag; bootstrap uses mos.demo.seed explicitly.
# PaymentGateway is simulated in all modes until a real adapter is implemented.
mos.demo.enabled=${MOS_DEMO:true}
# Browser origins allowed to call /api/app/** (the Flutter web build during development).
# Comma-separated patterns; add your deployed app's origin when hosting Flutter web elsewhere.
mos.cors.app-origins=${MOS_CORS_APP_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- Misc ---
management.endpoints.web.exposure.include=health
spring.servlet.multipart.max-file-size=5MB
server.error.include-message=never
mos.upload-dir=uploads

# Jackson 3 fails on missing primitives by default; a missing boolean/int means false/0 here.
spring.jackson.deserialization.fail-on-null-for-primitives=false
